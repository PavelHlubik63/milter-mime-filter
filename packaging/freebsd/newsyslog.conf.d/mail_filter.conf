# /etc/newsyslog.conf.d/mail_filter.conf
# Log rotation configuration for mail_filter
#
# Fields: logfile  [owner:group]  mode  count  size  when  flags  [/pidfile]  [signal]
#
# Flags:
#   B  -- binary (do not write a rotation header)
#   C  -- create the file if it does not exist
#   G  -- glob pattern
#   J  -- bzip2 compression
#   W  -- file watching -- WatchedFileHandler reopens the file automatically,
#          therefore there is no need to send a signal to the process.
#          The signal is intentionally omitted.
#
# size: 1024 = rotate when the file reaches 1 MB
# count: 30  = keep 30 archived log files
# when: @T00 = rotate daily at midnight

/var/log/mail_filter.log  postfix:postfix  640  12  *  $M1D0  BCJ
