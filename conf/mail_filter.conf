# mail_filter.conf -- sample configuration
#
# Reload rules and whitelist after editing them:
#   service mail_filter reload          (FreeBSD)
#   systemctl reload mail_filter        (Linux)
# Restart the service after changing this file itself.

[files]
# Relative paths are resolved relative to the directory containing this file.
rules     = mail_filter_rules.conf
whitelist = mail_filter_whitelist.cidr
logfile   = /var/log/mail_filter.log

[milter]
# Postfix resolves "private/X" in smtpd_milters relative to its own
# queue_directory (postconf -h queue_directory, normally /var/spool/postfix),
# so this path and "unix:private/mail_filter.sock" in main.cf are the same
# place. That location is correct whether or not smtpd and cleanup are
# chrooted: a chrooted process can reach nothing else, and a non-chrooted one
# reaches it as easily as any other absolute path. The post-install step
# rewrites this line to the real queue_directory when it creates this file.
socket  = unix:/var/spool/postfix/private/mail_filter.sock
timeout = 600

# Logging level for /var/log/mail_filter.log:
#   DEBUG   = detailed logging (every message, every rule, decoding)
#   INFO    = normal operation (reject and accept logs)
#   WARNING = only rejections and warnings (quiet operation)
#   ERROR   = errors only
#
# Startup and shutdown are recorded whatever the level: which version
# started, with which socket and which level. Three lines per restart,
# and they are the ones worth having when something is wrong.
#
# INFO and DEBUG record the decoded Subject and the envelope addresses of
# every message; WARNING records only the mail that was acted on. See "What
# the logging records" in mail_filter.conf(5).
loglevel = INFO

# Timestamp format for /var/log/mail_filter.log only:
#   bsd     = Aug 28 18:50:23
#   iso8601 = 2026-08-28T18:50:23.652662+00:00
#   anything else is used as a Python time.strftime() format string, e.g.:
#     %Y-%m-%d %H:%M:%S  = 2026-08-28 18:50:23
#   See https://docs.python.org/3/library/time.html#time.strftime for the
#   full list of directives -- they are case-sensitive (%Y is a 4-digit
#   year, %y a 2-digit one).
#   Note: %f (sub-second digits) is NOT supported here even though Python's
#   own datetime.strftime() has it -- use "iso8601" for microsecond precision.
#   Default: bsd on FreeBSD, iso8601 on Linux/Debian -- matching each
#   platform's native syslog convention.
# This setting is independent of [mail_log], whose timestamp is generated
# by the system syslog implementation.
log_timestamp = bsd

# Maximum amount of message body kept for filtering, in KB. Once this
# limit is reached, remaining body data is discarded and the "body"
# test still runs against the retained (truncated) prefix.
# 0 disables the limit (not recommended on an Internet-facing MX).
max_body_kb = 512

# In the log line for a REJECT/ACCEPT/warn, "matched=" shows what actually
# matched a regex rule (e.g. the one emoji that tripped an emoji rule), not
# the regex itself -- like pcre2grep --only-matching. This caps how many
# characters of that matched text are shown before it's cut off with " ...".
# 0 means no limit (show the full matched text, however long).
# This does not affect `mail_filter --test` / `--test-eml` / `--configtest`,
# which always show the full matching rule.
log_match_max_chars = 80

# If yes, a "warn" rule (see mail_filter_rules.conf) adds an
# X-Mail-Filter-Status header to the delivered message with the warn
# text(s), similar in spirit to SpamAssassin's X-Spam-Status. Never added
# for a REJECT (the message is never delivered) or when no warn fired
# (ACCEPT status).
# Disabled by default since it changes delivered mail, not just logging.
# Requires a service restart to take effect (it toggles a milter
# capability flag at startup).
add_warn_header = no

[mail_log]
# Optional structured message record written through syslog(3) with
# facility=mail. It is disabled by default and is independent of loglevel.
# On FreeBSD, mail facility messages normally go to /var/log/maillog.
# The actual destination is controlled by the system syslog configuration.
# FreeBSD note: for readable UTF-8/non-ASCII values in /var/log/maillog,
# use syslog-ng or another syslog implementation that preserves UTF-8.
#
# Before enabling: this records the Subject line and the envelope addresses
# of every message the milter sees, and keeps them as long as your log
# rotation does. Enable it if your site's policy on retaining message
# metadata allows it. The "format" line decides how much is recorded and
# every field in it is optional -- see "What the logging records" in
# mail_filter.conf(5).
enabled  = no
priority = warning
tag      = postfix/mail_filter
format   = {qid}:\theader Subject: '{subject_decoded}'\teFrom: '{envelope_from}'\thFrom: '{header_from}'\tbody_size={body_size_bytes}\tentity_count={entity_count}\tresult={result}\treason={reason}
