# ============================================================================
# SECTION 3: Body -- HTML entity obfuscation
# ============================================================================
# Spammers encode every character as an HTML entity (&#65;=A, &#x41;=A)
# instead of plain UTF-8. Dictionary-based anti-spam filters see nothing
# readable. Six or more entities within 100 characters signals obfuscation.
# The regex works on QP-soft-unfolded raw text -- entities spanning line
# breaks are merged before matching.
#
# Tune the threshold ({6,}) as needed:
#   {4,}  -- more aggressive, catches more, higher risk of false positives
#   {8,}  -- more conservative, fewer false positives
# ============================================================================

if body /(?:&#(?:\d{2,6}|x[0-9A-Fa-f]{2,5});.{0,100}){6,}/s {
    reject "HTML entity obfuscation detected";
}


