# ============================================================================
# mail_filter_rules.conf -- sample rules (DSL format)
# ============================================================================
#
# DSL syntax overview:
#
#   if CONDITION {
#       ACTION "optional message";
#   }
#
# Conditions -- tests:
#   subject       /regex/flags    decoded Subject (RFC 2047)
#   body          /regex/flags    raw message body (UTF-8, QP soft-breaks merged)
#   envelope_from /regex/flags    MAIL FROM (including angle brackets)
#   envelope_to   /regex/flags    RCPT TO   (alias: rcpt_to)
#   from          /regex/flags    From: header
#   to            /regex/flags    To: header
#   cc            /regex/flags    Cc: header
#   reply_to      /regex/flags    Reply-To: header
#   header "Name" /regex/flags    any header line, by name
#
# A test may also reference a file of regexes instead of an inline pattern:
#   subject refile:/path/to/list
#   header "X-Spam-Status" refile:lists/spam-status.regex
#
# Conditions -- logical operators:
#   cond1 and cond2                infix AND (recommended)
#   cond1 or  cond2                infix OR  (recommended)
#   not cond                       infix NOT (recommended)
#   anyof(cond1, cond2, ...)       legacy logical OR  -- at least one is true
#   allof(cond1, cond2, ...)       legacy logical AND -- all must be true
#   not(cond)                      legacy logical NOT
#   Precedence (highest to lowest): not > and > or. Use parentheses when
#   in doubt -- see mail_filter_rules.conf(5) for the full precedence table.
#
# Actions (inside { }, terminated with ; ):
#   reject "text";   Reject with SMTP 550 5.7.1 (text is optional)
#   accept;          Accept without further evaluation
#   warn   "text";   Log a warning and continue to next rule
#   dunno;           No action, continue to next rule
#
# Regex flags:  i = case-insensitive  m = multiline  s = dotall  x = verbose
#
# Rules are evaluated top to bottom. The first reject or accept stops
# processing. warn and dunno do NOT stop processing. If no rule produces
# a terminal reject/accept, the message is accepted.
#
# The message body is available as raw UTF-8 text. QP soft-breaks (=\r\n)
# are merged before matching so that entities spanning line boundaries
# (e.g. &#22=\r\n5;) are reconstructed correctly. See [milter] max_body_kb
# in mail_filter.conf for the amount of body kept for filtering.
#
# Live reload (no daemon restart):
#   service mail_filter reload      (FreeBSD)
#   systemctl reload mail_filter    (Linux)
#
# Testing:
#   mail_filter --test --subject "..." --body "..." ...
#   mail_filter --test-context /path/to/context.json
#   mail_filter --test-eml /path/to/message.eml
#   mail_filter --configtest
# ============================================================================


# ============================================================================
# SECTION 1: Explicit accept rules -- MUST COME BEFORE REJECT RULES
# ============================================================================
# Accept rules protect trusted senders from false positives. Place them at
# the TOP of the file, before all reject sections below.
# ============================================================================

# Own domain -- accept everything without further evaluation:
#
# if envelope_from /@(yourcompany|yourhostname)\.com>/i {
#     accept;
# }

# Transactional and marketing ESPs -- legitimate bulk senders:
# (Mailchimp, Brevo, SendGrid, Mailerlite, ...)
#
# if anyof(
#     envelope_from /\.mcsv\.net>$/i,
#     envelope_from /\.mandrillapp\.com>$/i,
#     envelope_from /\.sendgrid\.net>$/i,
#     envelope_from /\.brevo\.com>$/i,
#     envelope_from /\.mailerlite\.com>$/i
# ) {
#     accept;
# }


# ============================================================================
# SECTION 2: Subject-based rules
# ============================================================================
#
# Three examples, all commented out. A fresh installation rejects nothing
# until you have decided what it should reject.
#
# All three test the script a Subject is written in rather than its wording,
# and that is why these are the ones shipped. A rule about characters is
# either right or wrong for a site and stays that way; a rule about wording
# is right for one site in one month. Whether the first rule below is a good
# rule depends entirely on whether anyone who writes to you writes in
# Cyrillic, and only you know that.
#
# They are written as warn, not reject, on purpose. A warn rule logs the
# match and delivers the message anyway, so you can read a few weeks of log
# and find out what the rule would have done to real mail before it does it.
# See add_warn_header in mail_filter.conf(5) to have the decision appear in
# the delivered message as well, which turns your users into the people who
# tell you the rule is wrong.
#
# For rules about wording, keep the patterns in a file of their own and
# point one rule at it with refile:, rather than growing this file into a
# list of them.
#
# However that file comes about -- written by hand, or produced by
# something of your own -- check it against Subject lines you know to be
# legitimate before you deploy it, with check_regex.py --reverse. It is
# worth knowing what that check is for. The words every message in a spam
# run has in common are, when the run impersonates a company, that
# company's name; and that name is also in every real invoice the company
# ever sent. Nothing about the spam reveals this. Only the legitimate mail
# does.
#
#     if subject refile:spam_subjects.regex {
#         warn "spam subject list";
#     }


