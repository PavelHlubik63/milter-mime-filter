# Attachment filename in a Content-Disposition/Content-Type MIME header --
# same idea as a Postfix header_checks/pcre_table(5) rule, but the reject
# message can name the actual file since $1 pulls in the regex's own
# capture group (see mail_filter_rules.conf(5) BACKREFERENCES IN MESSAGES).
# Note: this is a `body` test -- MIME part headers are inside the message
# body, not the top-level RFC 822 headers -- so it is subject to the
# [milter] max_body_kb limit like any other body rule; an attachment
# declared after max_body_kb of preceding MIME parts will not be seen.
#
# if body /^Content-(Disposition|Type).*name\s*=\s*"?([^;]*\.(zip|rar|exe|com|bin|vbs|scr))"?\s*(;|$)/im {
#     reject "$2 attachment not allowed";
# }


