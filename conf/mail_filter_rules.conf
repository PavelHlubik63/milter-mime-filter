# ============================================================================
# SECTION 5: Body -- Business Email Compromise (BEC) / financial fraud
# ============================================================================
# BEC attacks impersonate company executives with an urgent request for a
# wire transfer or gift card purchase. Key signs: urgent Subject + financial
# request + external sender domain. Combining subject and body tests in one
# rule is what makes this kind of pattern possible to catch at all.
# ============================================================================

# Wire transfer request, urgent Subject, from an external domain:
#
# if subject /urgent|ASAP|confidential|important/i
#    and (body /wire\s+transfer|bank\s+transfer|IBAN|SWIFT/i
#         or body /send\s+funds|transfer\s+funds|make\s+a\s+payment/i)
#    and not envelope_from /@yourcompany\.com>/i {
#     reject "Possible BEC -- financial request from external sender";
# }

# Gift card request -- classic BEC vector:
#
# if allof(
