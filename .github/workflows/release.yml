name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build .deb
        run: bash packaging/debian/build_deb.sh

      - uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/*.deb

  build-pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build .pkg inside a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y python312 py312-pymilter
          run: |
            sh packaging/freebsd/build_pkg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-package
          path: dist/*.pkg

  release:
    needs: [build-deb, build-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb-package
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: pkg-package
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.pkg
